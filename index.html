function agendaItemsFor(ds){
 const rows=[];
 const add=(icon,title,section,detail)=>rows.push({icon,title:String(title||''),section,detail:String(detail||'')});
 (S.inbox||[]).filter(x=>!x.done&&x.due===ds).forEach(x=>add('☑️',x.t,'inbox',x.category||'Задачи'));
 (S.docs||[]).filter(x=>!x.done&&x.date===ds).forEach(x=>add(x.type==='Красота'?'💅':'🩺',x.t,x.type==='Красота'?'beauty':'doc',x.time||''));
 (S.custom||[]).filter(x=>x.date===ds).forEach(x=>add(/^💅/.test(x.title||'')?'💅':'📍',x.title,/^💅/.test(x.title||'')?'beauty':'cal',x.time||''));
 (S.kind||[]).filter(x=>!x.done&&x.date===ds).forEach(x=>add('👧',x.t,'kind',''));
 (S.calls||[]).filter(x=>!x.done&&x.date===ds).forEach(x=>add('📞',x.t,'call',''));
 (S.orders||[]).filter(x=>!x.done&&x.delivery===ds).forEach(x=>add('📦',x.t,'buy',x.st||''));
 (S.social||[]).filter(x=>!x.done&&x.publishDate===ds).forEach(x=>add('📣',x.t,'social',x.net||''));
 (S.routines||[]).filter(x=>v5dueRoutine(x,ds)&&!(x.completed||[]).includes(ds)).forEach(x=>add('🔁',x.t,'routines','повтор'));
 (S.dr||[]).forEach(x=>{if(String(x.date||'').slice(5)===ds.slice(5))add(x.type==='anniversary'?'💍':'🎂',x.name,'dr','ежегодно')});
 (S.courtCases||[]).filter(x=>x.hearing&&x.hearing.slice(0,10)===ds).forEach(x=>add('⚖️','Заседание: '+x.name,'court',x.hearing.slice(11,16)));
 (S.courtCases||[]).filter(x=>!x.done&&x.prepDue===ds).forEach(x=>add('📝','Дело '+x.name+': '+(x.prepare||'Подготовить документы'),'court','срок подготовки'));

 (S.heritageTasks||[]).filter(x=>!x.done&&x.due===ds).forEach(x=>add('📜',x.t,'heritage',''));
 const spouseDate=S.fam&&S.fam.spouse;
 if(spouseDate&&String(spouseDate).slice(5)===ds.slice(5)&&!rows.some(x=>x.section==='dr'&&/максимус|муж/i.test(x.title)))add('🎂','День рождения мужа','fest','ежегодно');
 return rows;
}

}

  if(!date||!time)return;
  const when=new Date(date+'T'+time+':00');const minutes=(when-now)/60000;
  if(minutes>=0&&minutes<=15)notify(prefix+'|15|'+date+'|'+time,'Через 15 минут: '+label);

 S.custom.forEach(e=>windowNotice(e.date,e.time,e.title,'meeting|'+e.id));
 S.docs.filter(x=>!x.done&&x.date).forEach(x=>{
  if(!x.time){if(x.date===day)notify('doc|day|'+x.id,'Сегодня запись: '+x.t+' (время не указано)');return}
  const when=new Date(x.date+'T'+x.time+':00');const min=(when-now)/60000;
  if(min>=0&&min<=30)notify('doc|30|'+x.id,'Через 30 минут: '+x.t+' ('+x.time+')');
  else if(min>30&&min<=120)notify('doc|120|'+x.id,'Через 2 часа: '+x.t+' ('+x.time+')');
  const nextDay=iso(new Date(now.getFullYear(),now.getMonth(),now.getDate()+1));
  if(x.date===nextDay)notify('doc|eve|'+x.id,'Завтра в '+x.time+': '+x.t);
 });
 const spouse=spouseNext();

function eventCourseIndex(i){
 const e=EVENTS[i];if(!e)return -1;
 const title=(e[3]||'').toLowerCase();
 if(/креативный код/.test(title))return COURSES.findIndex(c=>c.n.startsWith('Креативный код'));
 if(/старт:.*продвижение в социальных сетях/.test(title))return COURSES.findIndex(c=>c.n==='Продвижение в социальных сетях');

 return -1;
}

/* Short free-time suggestions are assembled from existing records, not copied. */
function v6FreeTimeCandidates(){
 const today=iso(new Date()),records=[];
 const add=(key,x,category,focus,estimated,opts={})=>{
  if(!x||x.done||!String(x.t||'').trim())return;
  if(opts.sampleKey&&isExampleItem(opts.sampleKey,x))return;
  if(opts.excluded)return;
  const duration=Number(x.minutes)>0?Number(x.minutes):estimated;
  const due=x.due||x.date||x.publishDate||'';
  if(!opts.includeFuture&&due&&due>today)return;
  records.push({id:String(x.id),key,title:String(x.t),category,focus,minutes:Math.max(5,Math.round(duration)),due,priority:x.priority||'обычно',source:x});
 };
 (S.inbox||[]).forEach(x=>add('inbox',x,x.category||'Личное',/Академия семьи|Детская афиша|Мама-юрист|Учёба|Цифровая колыбель|Бизнес-лаборатория|БАНКРОЛОТ/.test(x.category||'')?'Мои проекты':/Дом|Покупки|Садик|Малышка/.test(x.category||'')?'Дом и семья': 'Для себя',20,{includeFuture:true}));
 (S.calls||[]).forEach(x=>add('calls',x,'Звонки','Дом и семья',10,{sampleKey:'calls',includeFuture:true}));
 (S.kind||[]).forEach(x=>add('kind',x,'Садик','Дом и семья',15,{sampleKey:'kind',includeFuture:true}));
 (S.buys||[]).forEach(x=>add('buys',x,'Покупки','Дом и семья',10,{sampleKey:'buys',includeFuture:true}));
 (S.groceries||[]).forEach(x=>add('groceries',x,'Продукты','Дом и семья',10,{includeFuture:true}));
 (S.gifts||[]).forEach(x=>add('gifts',x,'Подарки','Дом и семья',20,{sampleKey:'gifts',includeFuture:true}));
 (S.docs||[]).forEach(x=>{
  // Only an unscheduled action to make an appointment is suitable for a spare-time slot.
  if(x.date||!/(записа|позвони|уточни|выбрать)/i.test(x.t||''))return;
  add('docs',x,'Здоровье','Для себя',15,{sampleKey:'docs',includeFuture:true});
 });
 (S.social||[]).forEach(x=>{
  if(x.done||isExampleItem('social',x))return;
  const status=x.status||'Идея';
  if(!['В работе','Готово'].includes(status)&&!x.publishDate)return;
  add('social',x,'Посты · '+(x.net||'Сообщество'),'Мои проекты',30,{includeFuture:true});
 });
 (S.orders||[]).forEach(x=>{
  if((x.st||'В избранном')!=='В избранном')return;
  add('orders',x,'Покупки и заказы','Дом и семья',10,{sampleKey:'orders',includeFuture:true});
 });
 (S.estate||[]).forEach(x=>add('estate',x,'Недвижимость','Мои проекты',25,{sampleKey:'estate',includeFuture:true}));
 (S.heritageTasks||[]).forEach(x=>add('heritage',x,'Наследие','Мои проекты',25,{includeFuture:true}));
 (S.courtCases||[]).filter(x=>!x.done&&x.prepare).forEach(x=>add('court',{...x,t:'Дело '+x.name+': '+x.prepare,due:x.prepDue||''},'Судебные дела','Мои проекты',45,{includeFuture:true}));
 (S.routines||[]).filter(x=>v5dueRoutine(x,today)&&!(x.completed||[]).includes(today)).forEach(x=>add('routines',x,'Регулярные дела','Дом и семья',15,{includeFuture:true}));
 (S.ny||[]).forEach(x=>add('ny',x,'Подготовка к Новому году','Дом и семья',25,{excluded:!x.userAdded,includeFuture:true}));
 (S.hs||[]).forEach(x=>add('hs',x,'Подготовка ко дню рождения','Дом и семья',25,{excluded:!x.userAdded,includeFuture:true}));
 return records;
}
function v6SuggestedItems(){
 const cap=Math.max(5,Number(S.v6.available)||20),focus=(S.v6.focus==='Все'||!S.v6.focus)?'Все дела':S.v6.focus,includeFuture=!!S.v6.includeFuture,today=iso(new Date());
 const items=v6FreeTimeCandidates().filter(x=>x.minutes<=cap&&(focus==='Все дела'||x.focus===focus)&& (includeFuture||!x.due||x.due<=today));
 const rank=x=>{
  let score=x.priority==='срочно'?110:x.priority==='важно'?50:0;
  if(x.due){const d=dLeft(x.due);score+=d<0?90:d===0?70:d===1?35:d<=7?15:0}
  if(x.key==='social'&&x.source.status==='В работе')score+=15;
  return score;
 };
 return items.sort((a,b)=>rank(b)-rank(a)||a.minutes-b.minutes).slice(0,8);
}
function v6suggestedTasks(){return v6SuggestedItems()}

 out+='<section class="v6pane"><h3>✨ Чем заняться прямо сейчас?</h3><p class="v6mut">Подбор из активных дел разных разделов. Оценка времени примерная. Нажми ✓, чтобы отметить дело выполненным в исходном разделе.</p><div class="v6field"><label>У меня есть <select id="v6available" onchange="v6filterTasks()">'+[5,10,15,20,25,30,40,60,90].map(m=>'<option value="'+m+'" '+((Number(S.v6.available)||20)===m?'selected':'')+'>'+m+' мин</option>').join('')+'</select></label><label>Направление <select id="v6focus" onchange="v6filterTasks()">'+['Все дела','Дом и семья','Мои проекты','Для себя'].map(c=>'<option '+(((S.v6.focus==='Все'||!S.v6.focus)?'Все дела':S.v6.focus)===c?'selected':'')+'>'+c+'</option>').join('')+'</select></label><label><input id="v6future" type="checkbox" '+(S.v6.includeFuture?'checked':'')+' onchange="v6filterTasks()"> Показывать будущие дела</label></div><div id="v6suggestions"></div></section>';
 out+='<section class="v6pane"><h3>🎁 Автоматическая подготовка праздника</h3><p class="v6mut">Создай план по шаблону, проверь даты этапов, затем перенеси выбранные задачи в ежедневник. Ничего не добавляется без подтверждения.</p><div class="v6field"><select id="v6holidaytype"><option value="birthday">День рождения</option><option value="newyear">Новый год</option><option value="kindergarten">Праздник в садике</option><option value="custom">Другой праздник</option></select><input id="v6holidayname" type="text" placeholder="Кого или что празднуем?"><input id="v6holidaydate" type="date"><button class="v6btn primary" onclick="v6addHoliday()">Составить план</button></div>';
 S.v6.holidays.forEach(h=>{out+='<div class="v6draft"><div class="v6flex"><div><b>'+safe(h.name)+'</b><div class="v6mut">'+safe(nice(h.date))+' · '+safe(V6_HOLIDAY_TYPES[h.type]?.title||'Праздник')+'</div></div><button class="v6btn warn" onclick="v6holidayRemove(\''+h.id+'\')">Удалить</button></div>';h.tasks.forEach(t=>out+='<div class="v6line"><label><input type="checkbox" '+(t.include?'checked':'')+' onchange="v6holidayEdit(\''+h.id+'\',\''+t.id+'\',\'include\',this.checked)"> '+safe(t.t)+'</label><div class="v6mut">'+safe(nice(v6holidayDue(h.date,Number(t.offset))))+' ('+(Number(t.offset)<=0?Math.abs(Number(t.offset))+' дн. до праздника':'после')+')</div></div>');out+='<div class="v6field"><button class="v6btn primary" onclick="v6holidayPublish(\''+h.id+'\')">＋ Добавить выбранные этапы в задачи</button></div></div>'});return out+'</section>'}

// Android home-screen voice shortcut. Launches the same app and local data store.
(function setupHomeScreenVoiceShortcut(){
  const params=new URLSearchParams(window.location.search);
  if(params.get('voice')!=='1')return;
  // Open the voice assistant directly. Automatic speech start can be blocked by
  // Android/browser user-activation policy, so always leave manual start visible.
  const run=()=>{
    try {
      go('assistant');
      const input=document.getElementById('v6speech');
      if(input){ input.setAttribute('aria-label','Продиктуй дела или введи текст'); }
      const speech=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!speech){toast('Распознавание не поддерживается: можно записать текст');return;}
      v6voiceStart();
    } catch(e){
      console.warn('Voice deep link could not auto-start', e);
      try{go('assistant');toast('Нажми «🎤 Продиктовать», чтобы начать');}catch(_){}
    }
  };
  // This runs after the original bootstrap, without changing the saved data schema.
  if(document.readyState==='complete')run();else window.addEventListener('load',run,{once:true});
})();
// Offline app shell cache, only available when served from HTTPS/localhost.
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  const freshVersion='2026-11-16-court-deadline-v9';
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(sessionStorage.getItem('olga-sw-reloaded')!==freshVersion){
      sessionStorage.setItem('olga-sw-reloaded',freshVersion);
      location.reload();
    }
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'})
      .then(reg=>reg.update()).catch(()=>{});
  });
}
