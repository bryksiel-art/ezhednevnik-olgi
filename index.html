/* ===== НАПОМИНАНИЯ ===== */
function remind(){
 if(!S.bell)return;
 const now=new Date(),day=iso(now),msgs=[];
 const notify=(key,msg)=>{const signature=day+'|'+key;if(!remind._seen[signature]){remind._seen[signature]=1;msgs.push(msg)}};
 function windowNotice(date,time,label,prefix){
  if(!date||!time)return;
  const when=new Date(date+'T'+time+':00');const minutes=(when-now)/60000;
  if(minutes>=0&&minutes<=15)notify(prefix+'|15|'+date+'|'+time,'Через 15 минут: '+label);
 }
 EVENTS.forEach(e=>windowNotice(e[0],e[1],e[3],'study'));
 S.custom.forEach(e=>windowNotice(e.date,e.time,e.title,'meeting|'+e.id));
 S.docs.filter(x=>!x.done&&x.date).forEach(x=>{
  if(!x.time){if(x.date===day)notify('doc|day|'+x.id,'Сегодня запись: '+x.t+' (время не указано)');return}
  const when=new Date(x.date+'T'+x.time+':00');const min=(when-now)/60000;
  if(min>=0&&min<=30)notify('doc|30|'+x.id,'Через 30 минут: '+x.t+' ('+x.time+')');
  else if(min>30&&min<=120)notify('doc|120|'+x.id,'Через 2 часа: '+x.t+' ('+x.time+')');
  const nextDay=iso(new Date(now.getFullYear(),now.getMonth(),now.getDate()+1));
  if(x.date===nextDay)notify('doc|eve|'+x.id,'Завтра в '+x.time+': '+x.t);
 });
 const spouse=spouseNext();
 if(spouse&&[7,3,1,0].includes(spouse.days))notify('spouse|'+spouse.days,spouse.days===0?'Сегодня день рождения супруга!':'До дня рождения супруга '+spouse.days+' дн.');
 S.dr.forEach(x=>{const b=nextBD(x.date);if(b&&[7,3,1,0].includes(b.days))notify('birthday|'+x.id+'|'+b.days,(b.days===0?'Сегодня ДР: ':'Скоро ДР: ')+x.name)});
 const due=S.inbox.filter(x=>!x.done&&x.due===day&&x.priority==='срочно');
 if(due.length)notify('urgent','Срочных задач сегодня: '+due.length);
 if(msgs.length)showReminderNotice(msgs);
}
function showReminderNotice(messages){
 let panel=document.getElementById('reminderPanel');
 if(!panel){panel=document.createElement('div');panel.id='reminderPanel';panel.style.cssText='position:fixed;z-index:100;right:12px;bottom:12px;max-width:min(380px,calc(100vw - 24px));background:white;border:1px solid #e4d8c7;border-radius:14px;box-shadow:0 8px 30px #0002;padding:12px 14px;font-size:14px';document.body.appendChild(panel)}
 panel.innerHTML='<b>🔔 Напоминания</b><button style="float:right;border:none;background:none;font-size:19px;cursor:pointer" onclick="this.parentNode.remove()" aria-label="Закрыть">×</button>'+messages.map(x=>'<div style="margin-top:8px">'+safe(x)+'</div>').join('');
}
function spouseNext(){return S.fam&&S.fam.spouse?nextBD(S.fam.spouse):null}
remind._seen={};
setInterval(remind,60000);

function v6todayPlus(days){const d=new Date();d.setDate(d.getDate()+days);return iso(d)}
function v6datePhrase(t){const a=t.toLowerCase(),now=new Date();if(/послезавтра/.test(a))return v6todayPlus(2);if(/завтра/.test(a))return v6todayPlus(1);if(/сегодня/.test(a))return v6todayPlus(0);
 const dm=a.match(/\b(\d{1,2})[.\/-](\d{1,2})(?:[.\/-](\d{4}))?\b/);if(dm){const d=new Date(Number(dm[3]||now.getFullYear()),Number(dm[2])-1,Number(dm[1]));if(!dm[3]&&d<today0())d.setFullYear(d.getFullYear()+1);if(d.getDate()===Number(dm[1])&&d.getMonth()===Number(dm[2])-1)return iso(d)}
 const months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];const mn=a.match(/(\d{1,2})\s+(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)/);if(mn){const month=months.indexOf(mn[2]);const d=new Date(now.getFullYear(),month,Number(mn[1]));if(d<today0())d.setFullYear(d.getFullYear()+1);if(d.getDate()===Number(mn[1]))return iso(d)}
 const days=a.match(/через\s+(\d{1,2})\s+дн/);if(days)return v6todayPlus(Number(days[1]));
 const words=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];const variants=['воскресенье','понедельник','вторник','среду','четверг','пятницу','субботу'];let idx=variants.findIndex(w=>a.includes(w));if(idx<0)idx=words.findIndex(w=>a.includes(w));if(idx>=0){const d=new Date();let shift=(idx-d.getDay()+7)%7;if(shift===0||a.includes('следующ'))shift+=7;d.setDate(d.getDate()+shift);return iso(d)}return ''}

// Android home-screen voice shortcut. Launches the same app and local data store.
(function setupHomeScreenVoiceShortcut(){
  const params=new URLSearchParams(window.location.search);
  if(params.get('voice')!=='1')return;
  // Open the voice assistant directly. Automatic speech start can be blocked by
  // Android/browser user-activation policy, so always leave manual start visible.
  const run=()=>{
    try {
      go('assistant');
      const input=document.getElementById('v6speech');
      if(input){ input.setAttribute('aria-label','Продиктуй дела или введи текст'); }
      const speech=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!speech){toast('Распознавание не поддерживается: можно записать текст');return;}
      v6voiceStart();
    } catch(e){
      console.warn('Voice deep link could not auto-start', e);
      try{go('assistant');toast('Нажми «🎤 Продиктовать», чтобы начать');}catch(_){}
    }
  };
  // This runs after the original bootstrap, without changing the saved data schema.
  if(document.readyState==='complete')run();else window.addEventListener('load',run,{once:true});
})();
